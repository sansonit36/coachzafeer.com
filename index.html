      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)

    <!-- Funnel Tracking: fbp/fbc propagation, CTA click, CAPI client -->
    <script>
      // ---------- Helpers ----------
      function qp(name){ try{ const u=new URL(window.location.href); return u.searchParams.get(name)||''; }catch(e){ return ''; } }
      function getCookie(name){
        const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g,'\\$1') + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : '';
      }
      // Build fbc from fbclid (Meta format: fb.1.<unix_ts>.<fbclid>)
      function buildFBC(){
        const fbclid = qp('fbclid');
        if(!fbclid) return '';
        const ts = Math.floor(Date.now()/1000);
        return `fb.1.${ts}.${fbclid}`;
      }

      // Store identifiers
      window.__coachz_ids = {
        fbp: getCookie('_fbp') || '',
        fbc: buildFBC()
      };

      // ---------- Attach fbp/fbc to outbound form links ----------
      const FORM_HOSTS = [
        'coachzafeer.com',
        'www.coachzafeer.com',
        'kochzafeu.com',
        'www.kochzafeu.com'
      ];

      function needsAugment(a){
        try{
          if(!a || !a.href) return false;
          const url = new URL(a.href, window.location.href);
          return FORM_HOSTS.some(h => url.hostname === h || url.hostname.endsWith('.'+h));
        }catch(e){ return false; }
      }

      function augmentLink(a){
        try{
          const url = new URL(a.href, window.location.href);
          if (window.__coachz_ids?.fbp && !url.searchParams.get('fbp')) url.searchParams.set('fbp', window.__coachz_ids.fbp);
          if (window.__coachz_ids?.fbc && !url.searchParams.get('fbc')) url.searchParams.set('fbc', window.__coachz_ids.fbc);
          a.href = url.toString();
        }catch(e){}
      }

      // --------- CAPI sender (to PHP endpoint on coachzafeer.com) ---------
      const CAPI_ENDPOINT = 'https://coachzafeer.com/track/meta-capi.php';
      const CAPI_SECRET   = 'Asdf9988!'; // must match PHP script

      async function sendCAPI(event_name, { event_id, custom_data } = {}) {
        try {
          const body = {
            event_name,
            event_id,
            event_source_url: location.href,
            fbp: window.__coachz_ids?.fbp || null,
            fbc: window.__coachz_ids?.fbc || null,
            custom_data: custom_data || {}
          };
          await fetch(CAPI_ENDPOINT, {
            method: 'POST',
            headers: {
              'Content-Type':'application/json',
              'X-Api-Secret': CAPI_SECRET
            },
            body: JSON.stringify(body),
            keepalive: true
          });
        } catch(e) { /* no-op */ }
      }

      function wireAnchor(a){
        if(!a || a.__wired) return;
        if(needsAugment(a)) augmentLink(a);
        a.addEventListener('click', function(){
          if(needsAugment(a)) augmentLink(a); // ensure freshest fbp just-in-time
          const clickId = 'cta_' + Date.now() + '_' + Math.random().toString(36).slice(2);
          const linkText = (a.textContent||'').trim().slice(0,120);

          // Browser
          fbq('trackCustom','ClickCTA', {event_id: clickId, link_text: linkText, href: a.href});
          // Server (CAPI)
          sendCAPI('ClickCTA', { event_id: clickId, custom_data: { link_text: linkText, href: a.href } });
        }, {passive:true});
        a.__wired = true;
      }

      function scanAndWire(){
        document.querySelectorAll('a[href]').forEach(wireAnchor);
      }

      document.addEventListener('DOMContentLoaded', function(){
        // update fbp cookie shortly after pixel initializes
        setTimeout(function(){
          const fbpNew = getCookie('_fbp');
          if(fbpNew) window.__coachz_ids.fbp = fbpNew;
        }, 500);

        // Send PageView via CAPI (dedup with same event_id)
        sendCAPI('PageView', { event_id: window.__coachz_eid_pageview });

        scanAndWire();
        const mo = new MutationObserver(() => scanAndWire());
        mo.observe(document.documentElement, {childList:true, subtree:true});
      });
    </script>
